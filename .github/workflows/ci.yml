name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: nightly
          targets: wasm32-wasip2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo check --target wasm32-wasip2

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: nightly
          targets: wasm32-wasip2
          components: clippy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo clippy --target wasm32-wasip2 -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          channel: nightly
          components: rustfmt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo fmt -- --check

  forbidden:
    name: Crates std has replaced
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `cfg-if` and `assert_matches` are refused — `std::cfg_select!` and
      # `std::assert_matches!` replace them and have been stable since 1.96.
      # No toolchain: the check reads our manifests, not the lockfile.
      - run: python3 scripts/forbidden-crates.py
